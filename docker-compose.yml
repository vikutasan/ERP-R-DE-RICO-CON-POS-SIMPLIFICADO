services:
  db:
    image: postgres:15-alpine
    container_name: rderico-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ../ERP-R-DE-RICO-DATA/postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rderico-api-dev
    restart: on-failure:5
    ports:
      - "5001:3001"
    volumes:
      - ./apps/api:/app
      - ../ERP-R-DE-RICO-DATA/catalogos:/app/static/catalog
      - ../ERP-R-DE-RICO-DATA/images:/app/static/images
      - ../ERP-R-DE-RICO-DATA/config/terminal_status.json:/app/terminal_status.json
      - ../ERP-R-DE-RICO-DATA/totem_media:/app/media/totem      # V16: imágenes del tótem
      # v7 (Fase 8): dataset de entrenamiento de vision (imagenes + labels YOLO).
      # Se monta en una ruta ABSOLUTA y estable (/app/static/training) para que
      # el MISMO directorio fisico del host pueda montarse en el motor de IA
      # (ia-local) como /dataset. Antes se usaba la ruta relativa
      # "apps/api/static/training" que dentro del contenedor resolvia a
      # /app/apps/api/static/training (doble apps/api) -> carpeta distinta.
      - ../ERP-R-DE-RICO-DATA/vision_training:/app/static/training
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3001
      # v7 (Fase 8): raiz del dataset de entrenamiento de vision. Debe coincidir
      # con el bind mount de arriba y con el volumen /dataset de ia-local.
      - VISION_TRAINING_DIR=/app/static/training
      # ---------------------------------------------------------------------
      # AI Gateway (v7 Fase 5) — Motor de IA Local
      # ---------------------------------------------------------------------
      # El API NUNCA importa torch/whisper/ultralytics: solo hace HTTP al
      # motor. Si el motor no esta levantado, el API devuelve 503
      # IA_NO_DISPONIBLE y el POS sigue operando en modo manual.
      #
      # Para APAGAR la IA sin desplegar codigo: AI_LOCAL_ENABLED=false
      # ---------------------------------------------------------------------
      - AI_LOCAL_ENABLED=${AI_LOCAL_ENABLED:-false}
      - AI_LOCAL_URL=${AI_LOCAL_URL:-}
      - AI_LOCAL_TIMEOUT=${AI_LOCAL_TIMEOUT:-30}
    depends_on:
      - db
    networks:
      # "default" mantiene la comunicacion con db y pos.
      # "rderico-ia-net" es la red aislada del motor de IA (compose aparte).
      # Si el motor no esta levantado, la red existe igual y nada se rompe.
      - default
      - rderico-ia-net

  pos:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rderico-pos-dev
    restart: always
    ports:
      - "5000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    # v19.1-hotfix: NO fijar VITE_API_URL a una IP LAN.
    # El frontend deriva el API del hostname del navegador (apps/shared/config.js),
    # de modo que cualquier cliente (PC/tablet/celular) que abra el POS en
    # http://<host>:5000 llama correctamente a http://<host>:5001.
    # Fijar una IP aqui rompia el POS en cualquier host distinto -> "sin conexion".

# Los volúmenes ahora son externos (Bind Mounts) para mayor seguridad y facilidad de backup.

networks:
  # Red aislada del motor de IA. La crea docker-compose.ai.yml.
  # Se declara aqui como "external" para que el API pueda unirse a ella
  # SIN que este compose intente crearla ni borrarla.
  #
  # Si el motor de IA no esta levantado, la red no existe y `docker compose up`
  # fallaria. Por eso el arranque normal del ERP debe hacerse con:
  #   docker compose up -d --no-deps api    (solo recrea el api)
  # o levantar primero el motor de IA.
  rderico-ia-net:
    external: true
    name: rderico-ia-net
